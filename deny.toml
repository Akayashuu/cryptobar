[advisories]
version = 2

[licenses]
version = 2
# Toutes permissives et compatibles avec la MIT du projet.
# "Apache-2.0 WITH LLVM-exception" comes from target-lexicon (the glib/gtk
# chain), "CDLA-Permissive-2.0" from webpki-roots, which embeds the store of
# certificats de Mozilla.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
