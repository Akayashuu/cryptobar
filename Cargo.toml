[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Akayashuu/cryptobar"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
etcetera = "0.10"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
thiserror = "2"
toml = "0.9"
toml_edit = "0.25"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
gtk4 = { version = "0.9" }
# The PNG encoding of Cairo is not enabled by gtk4: the window needs it to
# export the curve. Same version as the one gtk4 pulls in, so a single copy of
# the library.
cairo-rs = { version = "0.20", features = ["png"] }
rustix-libc-wrappers = { version = "0.1.1", features = ["process"] }
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
integer_division = "deny"
arithmetic_side_effects = "deny"
exit = "deny"
