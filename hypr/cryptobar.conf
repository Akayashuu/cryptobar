# Hyprland rules for cryptobar.
# Include it from ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/cryptobar.conf

# The price window opens floating, centred, without stealing the focus from the
# rest of the session.
windowrulev2 = float, class:^(dev\.akayashuu\.cryptobar)$
windowrulev2 = size 640 940, class:^(dev\.akayashuu\.cryptobar)$
windowrulev2 = center, class:^(dev\.akayashuu\.cryptobar)$
windowrulev2 = animation popin, class:^(dev\.akayashuu\.cryptobar)$

# Keyboard shortcuts.
bind = SUPER, C, exec, cryptobar popup
bind = SUPER SHIFT, C, exec, cryptobar chart --window
bind = SUPER ALT, C, exec, cryptobar refresh
