name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  no-default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --no-default-features
      - name: Startup budget on a warm cache
        run: |
          set -euo pipefail
          # The module runs at every Waybar tick: beyond 25 ms on a shared
          # runner, something has regressed.
          dir=$(mktemp -d)
          mkdir -p "$dir/cache" "$dir/run"
          printf 'coins = ["bitcoin"]\ncurrency = "eur"\nrefresh_interval = 3600\n' > "$dir/config.toml"
          python3 ci/seed_cache.py "$dir/cache"
          export CRYPTOBAR_CACHE_DIR="$dir/cache" CRYPTOBAR_RUNTIME_DIR="$dir/run"
          export CRYPTOBAR_API_BASE=http://127.0.0.1:1
          bin=./target/release/cryptobar
          # First run skipped: it pays for the page loading.
          "$bin" --config "$dir/config.toml" bar > /dev/null
          start=$(date +%s%N)
          for _ in $(seq 20); do "$bin" --config "$dir/config.toml" bar > /dev/null; done
          end=$(date +%s%N)
          avg=$(( (end - start) / 20 / 1000000 ))
          echo "moyenne : ${avg} ms par tick"
          if [ "$avg" -gt 25 ]; then
            echo "::error::startup budget exceeded: ${avg} ms > 25 ms"
            exit 1
          fi
